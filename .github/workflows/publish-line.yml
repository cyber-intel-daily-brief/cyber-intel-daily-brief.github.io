name: Publish Dashboard and Send LINE

on:
  push:
    branches: [main]
    paths:
      - "index.html"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only; do not send LINE'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  DASHBOARD_URL: https://cyber-intel-daily-brief.github.io/

jobs:
  verify-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate publication consistency
        run: python3 scripts/validate_publication.py

      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for report_id: $REPORT_ID"
          for i in $(seq 1 30); do
            BODY="$(curl -fsSL "${DASHBOARD_URL}?cb=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$BODY" | grep -Fq "$REPORT_ID"; then
              echo "GitHub Pages contains the expected report_id."
              exit 0
            fi
            echo "Attempt ${i}/30: GitHub Pages not updated yet."
            sleep 10
          done
          echo "Timed out waiting for GitHub Pages deployment."
          exit 1

      - name: Dry run result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo 'DRY RUN PASSED - no LINE request sent'

      - name: Prepare LINE requests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        env:
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${LINE_GROUP_ID:-}" ]; then
            echo "Missing repository secret: LINE_GROUP_ID"
            exit 1
          fi

          jq '.broadcast' line-payload.json > /tmp/line-broadcast.json
          jq -e '.messages | type == "array" and length > 0' /tmp/line-broadcast.json >/dev/null

          jq --arg to "$LINE_GROUP_ID"             '{to: $to, messages: .broadcast.messages}'             line-payload.json > /tmp/line-group-push.json

          jq -e '.to | type == "string" and length > 0' /tmp/line-group-push.json >/dev/null
          jq -e '.messages | type == "array" and length > 0' /tmp/line-group-push.json >/dev/null

      - name: Send to LINE OA and group
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${LINE_CHANNEL_ACCESS_TOKEN:-}" ]; then
            echo "Missing repository secret: LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi

          BROADCAST_HTTP="$(
            curl -sS -o /tmp/line-broadcast-response.txt -w "%{http_code}"               -X POST "https://api.line.me/v2/bot/message/broadcast"               -H "Authorization: Bearer ${LINE_CHANNEL_ACCESS_TOKEN}"               -H "Content-Type: application/json"               --data-binary @/tmp/line-broadcast.json
          )"

          GROUP_HTTP="$(
            curl -sS -o /tmp/line-group-response.txt -w "%{http_code}"               -X POST "https://api.line.me/v2/bot/message/push"               -H "Authorization: Bearer ${LINE_CHANNEL_ACCESS_TOKEN}"               -H "Content-Type: application/json"               --data-binary @/tmp/line-group-push.json
          )"

          echo "LINE OA broadcast HTTP status: ${BROADCAST_HTTP}"
          echo "LINE group push HTTP status: ${GROUP_HTTP}"

          if [ "${BROADCAST_HTTP}" != "200" ]; then
            echo "LINE OA broadcast failed:"
            cat /tmp/line-broadcast-response.txt || true
          fi

          if [ "${GROUP_HTTP}" != "200" ]; then
            echo "LINE group push failed:"
            cat /tmp/line-group-response.txt || true
          fi

          if [ "${BROADCAST_HTTP}" != "200" ] || [ "${GROUP_HTTP}" != "200" ]; then
            exit 1
          fi

          echo "LINE OA broadcast and group push completed successfully."
